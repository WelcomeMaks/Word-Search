<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wykreślanka - Pielęgniarstwo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: oklch(0.9816 0.0017 247.8390);
            --foreground: oklch(0.1649 0.0352 281.8285);
            --card: oklch(1.0000 0 0);
            --card-foreground: oklch(0.1649 0.0352 281.8285);
            --popover: oklch(1.0000 0 0);
            --popover-foreground: oklch(0.1649 0.0352 281.8285);
            --primary: oklch(0.6726 0.2904 341.4084);
            --primary-foreground: oklch(1.0000 0 0);
            --secondary: oklch(0.9595 0.0200 286.0164);
            --secondary-foreground: oklch(0.1649 0.0352 281.8285);
            --muted: oklch(0.9595 0.0200 286.0164);
            --muted-foreground: oklch(0.1649 0.0352 281.8285);
            --accent: oklch(0.8903 0.1739 171.2690);
            --accent-foreground: oklch(0.1649 0.0352 281.8285);
            --destructive: oklch(0.6535 0.2348 34.0370);
            --destructive-foreground: oklch(1.0000 0 0);
            --border: oklch(0.9205 0.0086 225.0878);
            --input: oklch(0.9205 0.0086 225.0878);
            --ring: oklch(0.6726 0.2904 341.4084);
            --chart-1: oklch(0.6726 0.2904 341.4084);
            --chart-2: oklch(0.5488 0.2944 299.0954);
            --chart-3: oklch(0.8442 0.1457 209.2851);
            --chart-4: oklch(0.8903 0.1739 171.2690);
            --chart-5: oklch(0.9168 0.1915 101.4070);
            --sidebar: oklch(0.9595 0.0200 286.0164);
            --sidebar-foreground: oklch(0.1649 0.0352 281.8285);
            --sidebar-primary: oklch(0.6726 0.2904 341.4084);
            --sidebar-primary-foreground: oklch(1.0000 0 0);
            --sidebar-accent: oklch(0.8903 0.1739 171.2690);
            --sidebar-accent-foreground: oklch(0.1649 0.0352 281.8285);
            --sidebar-border: oklch(0.9205 0.0086 225.0878);
            --sidebar-ring: oklch(0.6726 0.2904 341.4084);
            --font-sans: Outfit, sans-serif;
            --font-serif: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
            --font-mono: Fira Code, monospace;
            --radius: 0.5rem;
            --shadow-x: 0px;
            --shadow-y: 4px;
            --shadow-blur: 8px;
            --shadow-spread: -2px;
            --shadow-opacity: 0.1;
            --shadow-color: hsl(0 0% 0%);
            --shadow-2xs: 0px 4px 8px -2px hsl(0 0% 0% / 0.05);
            --shadow-xs: 0px 4px 8px -2px hsl(0 0% 0% / 0.05);
            --shadow-sm: 0px 4px 8px -2px hsl(0 0% 0% / 0.10), 0px 1px 2px -3px hsl(0 0% 0% / 0.10);
            --shadow: 0px 4px 8px -2px hsl(0 0% 0% / 0.10), 0px 1px 2px -3px hsl(0 0% 0% / 0.10);
            --shadow-md: 0px 4px 8px -2px hsl(0 0% 0% / 0.10), 0px 2px 4px -3px hsl(0 0% 0% / 0.10);
            --shadow-lg: 0px 4px 8px -2px hsl(0 0% 0% / 0.10), 0px 4px 6px -3px hsl(0 0% 0% / 0.10);
            --shadow-xl: 0px 4px 8px -2px hsl(0 0% 0% / 0.10), 0px 8px 10px -3px hsl(0 0% 0% / 0.10);
            --shadow-2xl: 0px 4px 8px -2px hsl(0 0% 0% / 0.25);
            --tracking-normal: 0em;
            --spacing: 0.25rem;
        }

        @theme inline {
            --color-background: var(--background);
            --color-foreground: var(--foreground);
            --color-card: var(--card);
            --color-card-foreground: var(--card-foreground);
            --color-popover: var(--popover);
            --color-popover-foreground: var(--popover-foreground);
            --color-primary: var(--primary);
            --color-primary-foreground: var(--primary-foreground);
            --color-secondary: var(--secondary);
            --color-secondary-foreground: var(--secondary-foreground);
            --color-muted: var(--muted);
            --color-muted-foreground: var(--muted-foreground);
            --color-accent: var(--accent);
            --color-accent-foreground: var(--accent-foreground);
            --color-destructive: var(--destructive);
            --color-destructive-foreground: var(--destructive-foreground);
            --color-border: var(--border);
            --color-input: var(--input);
            --color-ring: var(--ring);
            --color-chart-1: var(--chart-1);
            --color-chart-2: var(--chart-2);
            --color-chart-3: var(--chart-3);
            --color-chart-4: var(--chart-4);
            --color-chart-5: var(--chart-5);
            --color-sidebar: var(--sidebar);
            --color-sidebar-foreground: var(--sidebar-foreground);
            --color-sidebar-primary: var(--sidebar-primary);
            --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
            --color-sidebar-accent: var(--sidebar-accent);
            --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
            --color-sidebar-border: var(--sidebar-border);
            --color-sidebar-ring: var(--sidebar-ring);

            --font-sans: var(--font-sans);
            --font-mono: var(--font-mono);
            --font-serif: var(--font-serif);

            --radius-sm: calc(var(--radius) - 4px);
            --radius-md: calc(var(--radius) - 2px);
            --radius-lg: var(--radius);
            --radius-xl: calc(var(--radius) + 4px);

            --shadow-2xs: var(--shadow-2xs);
            --shadow-xs: var(--shadow-xs);
            --shadow-sm: var(--shadow-sm);
            --shadow: var(--shadow);
            --shadow-md: var(--shadow-md);
            --shadow-lg: var(--shadow-lg);
            --shadow-xl: var(--shadow-xl);
            --shadow-2xl: var(--shadow-2xl);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background: var(--background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .container {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-lg);
            max-width: 100%;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--muted-foreground);
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .words-section {
            margin-bottom: 16px;
            padding: 12px;
            background: var(--secondary);
            border-radius: var(--radius-md);
        }

        .words-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--foreground);
            font-size: 0.9rem;
        }

        .words-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .word-item {
            padding: 8px 10px;
            background: var(--card);
            border-radius: var(--radius-sm);
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--card-foreground);
        }

        .word-item.found {
            background: var(--accent);
            color: var(--accent-foreground);
            border-color: var(--accent);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .grid-container {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .grid {
            display: inline-grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 1px;
            background: var(--border);
            padding: 1px;
            border-radius: var(--radius-sm);
            touch-action: none;
        }

        .cell {
            width: 22px;
            height: 22px;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
            color: var(--foreground);
            touch-action: none;
        }

        .cell.selected {
            background: var(--primary);
            color: var(--primary-foreground);
            transform: scale(1.05);
        }

        .cell.found {
            background: var(--accent);
            color: var(--accent-foreground);
        }

        .score {
            text-align: center;
            font-size: 1rem;
            margin-top: 16px;
            color: var(--foreground);
            font-weight: 500;
        }

        .score span {
            color: var(--primary);
            font-weight: 700;
        }

        .reset-btn {
            display: block;
            margin: 16px auto 0;
            padding: 12px 28px;
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: calc(var(--radius) * 2);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-family: var(--font-sans);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 200px;
        }

        .reset-btn:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-sm);
        }

        .congrats {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent);
            margin-top: 16px;
            font-weight: 700;
            display: none;
            padding: 12px;
            background: var(--secondary);
            border-radius: var(--radius-md);
        }

        /* Tablet and larger screens */
        @media (min-width: 640px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 24px;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 1.1rem;
                margin-bottom: 20px;
            }

            .words-section {
                margin-bottom: 24px;
                padding: 16px;
            }

            .words-title {
                font-size: 1.1rem;
                margin-bottom: 12px;
            }

            .words-list {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .word-item {
                padding: 10px 14px;
                font-size: 0.9rem;
            }

            .cell {
                width: 30px;
                height: 30px;
                font-size: 14px;
                gap: 2px;
            }

            .score {
                font-size: 1.2rem;
                margin-top: 20px;
            }

            .reset-btn {
                margin: 20px auto 0;
                padding: 14px 32px;
                font-size: 1.1rem;
                width: auto;
            }

            .congrats {
                font-size: 1.3rem;
                margin-top: 20px;
                padding: 16px;
            }
        }

        /* Desktop screens */
        @media (min-width: 1024px) {
            .container {
                padding: 32px;
                max-width: 900px;
            }

            h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
            }

            .words-section {
                margin-bottom: 30px;
                padding: 20px;
            }

            .words-list {
                grid-template-columns: repeat(5, 1fr);
            }

            .word-item {
                padding: 10px 16px;
                font-size: 1rem;
            }

            .cell {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .cell:hover {
                background: var(--secondary);
            }

            .score {
                font-size: 1.4rem;
            }

            .reset-btn:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-xl);
            }

            .congrats {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Wykreślanka</h1>
        <div class="subtitle">Tematyka: Pielęgniarstwo</div>

        <div class="words-section">
            <div class="words-title">Znajdź następujące słowa:</div>
            <div class="words-list" id="wordsList"></div>
        </div>

        <div class="grid-container">
            <div class="grid" id="grid"></div>
        </div>

        <div class="score">
            Znalezione słowa: <span id="score">0</span> / <span id="total">10</span>
        </div>

        <div class="congrats" id="congrats">🎉 Gratulacje! Znalazłeś wszystkie słowa! 🎉</div>

        <button class="reset-btn" onclick="resetGame()">Nowa gra</button>
    </div>

    <script>
        const GRID_SIZE = 15;
        const WORDS = [
            'PIELĘGNIARKA',
            'ZASTRZYK',
            'BANDAŻ',
            'TERMOMETR',
            'LEKARZ',
            'SZPITAL',
            'PACJENT',
            'DIAGNOZA',
            'OPATRUNEK',
            'TERAPIA'
        ];

        let grid = [];
        let wordPositions = {};
        let selectedCells = [];
        let foundWords = new Set();
        let isSelecting = false;

        // Kierunki: prawo, dół, prawo-dół, prawo-góra
        const DIRECTIONS = [
            { dx: 1, dy: 0 },   // poziomo prawo
            { dx: 0, dy: 1 },   // pionowo dół
            { dx: 1, dy: 1 },   // ukośnie prawo-dół
            { dx: 1, dy: -1 }   // ukośnie prawo-góra
        ];

        function initializeGrid() {
            grid = Array(GRID_SIZE).fill(null).map(() =>
                Array(GRID_SIZE).fill('')
            );
            wordPositions = {};
            foundWords = new Set();
        }

        function canPlaceWord(word, x, y, direction) {
            const len = word.length;

            for (let i = 0; i < len; i++) {
                const newX = x + direction.dx * i;
                const newY = y + direction.dy * i;

                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }

                const cell = grid[newY][newX];
                if (cell !== '' && cell !== word[i]) {
                    return false;
                }
            }

            return true;
        }

        function placeWord(word, x, y, direction) {
            const positions = [];

            for (let i = 0; i < word.length; i++) {
                const newX = x + direction.dx * i;
                const newY = y + direction.dy * i;
                grid[newY][newX] = word[i];
                positions.push({ x: newX, y: newY });
            }

            wordPositions[word] = positions;
        }

        function placeWords() {
            const shuffledWords = [...WORDS].sort(() => Math.random() - 0.5);

            for (const word of shuffledWords) {
                let placed = false;
                let attempts = 0;
                const maxAttempts = 100;

                while (!placed && attempts < maxAttempts) {
                    const x = Math.floor(Math.random() * GRID_SIZE);
                    const y = Math.floor(Math.random() * GRID_SIZE);
                    const direction = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];

                    if (canPlaceWord(word, x, y, direction)) {
                        placeWord(word, x, y, direction);
                        placed = true;
                    }

                    attempts++;
                }

                if (!placed) {
                    console.warn(`Nie udało się umieścić słowa: ${word}`);
                }
            }
        }

        function fillEmptyCells() {
            const polishLetters = 'AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSŚTUWYZŹŻ';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x] === '') {
                        grid[y][x] = polishLetters[Math.floor(Math.random() * polishLetters.length)];
                    }
                }
            }
        }

        function getCellFromPoint(x, y) {
            const element = document.elementFromPoint(x, y);
            if (element && element.classList.contains('cell')) {
                return element;
            }
            return null;
        }

        function renderGrid() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = grid[y][x];
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    // Mouse events (for desktop)
                    cell.addEventListener('mousedown', handleCellMouseDown);
                    cell.addEventListener('mouseenter', handleCellMouseEnter);
                    cell.addEventListener('mouseup', handleCellMouseUp);

                    // Touch events (for mobile)
                    cell.addEventListener('touchstart', handleCellTouchStart, { passive: false });
                    cell.addEventListener('touchmove', handleCellTouchMove, { passive: false });
                    cell.addEventListener('touchend', handleCellTouchEnd, { passive: false });

                    gridElement.appendChild(cell);
                }
            }
        }

        function renderWordsList() {
            const wordsListElement = document.getElementById('wordsList');
            wordsListElement.innerHTML = '';

            WORDS.forEach(word => {
                const wordItem = document.createElement('div');
                wordItem.className = 'word-item';
                wordItem.textContent = word;
                wordItem.id = `word-${word}`;
                wordsListElement.appendChild(wordItem);
            });
        }

        // Mouse event handlers (desktop)
        function handleCellMouseDown(e) {
            e.preventDefault();
            startSelection(e.target);
        }

        function handleCellMouseEnter(e) {
            if (!isSelecting) return;
            continueSelection(e.target);
        }

        function handleCellMouseUp(e) {
            if (isSelecting) {
                endSelection();
            }
        }

        // Touch event handlers (mobile)
        function handleCellTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('cell')) {
                startSelection(element);
            }
        }

        function handleCellTouchMove(e) {
            e.preventDefault();
            if (!isSelecting) return;

            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('cell')) {
                continueSelection(element);
            }
        }

        function handleCellTouchEnd(e) {
            e.preventDefault();
            if (isSelecting) {
                endSelection();
            }
        }

        function startSelection(cellElement) {
            isSelecting = true;
            selectedCells = [];
            clearSelection();

            const x = parseInt(cellElement.dataset.x);
            const y = parseInt(cellElement.dataset.y);
            selectedCells.push({ x, y });
            cellElement.classList.add('selected');
        }

        function continueSelection(cellElement) {
            if (!cellElement) return;

            const x = parseInt(cellElement.dataset.x);
            const y = parseInt(cellElement.dataset.y);

            // Sprawdź czy komórka jest w linii prostej z poprzednimi
            if (selectedCells.length > 0) {
                const lastCell = selectedCells[selectedCells.length - 1];
                const isInLine = checkIfInLine(selectedCells[0], lastCell, { x, y });

                if (isInLine && !selectedCells.some(cell => cell.x === x && cell.y === y)) {
                    selectedCells.push({ x, y });
                    cellElement.classList.add('selected');
                }
            }
        }

        function endSelection() {
            isSelecting = false;
            checkSelectedWord();
        }

        function checkIfInLine(start, current, next) {
            if (selectedCells.length === 1) return true;

            const dx1 = current.x - start.x;
            const dy1 = current.y - start.y;
            const dx2 = next.x - current.x;
            const dy2 = next.y - current.y;

            // Normalizuj kierunki
            const normalize = (val) => val === 0 ? 0 : val / Math.abs(val);

            const ndx1 = normalize(dx1);
            const ndy1 = normalize(dy1);
            const ndx2 = normalize(dx2);
            const ndy2 = normalize(dy2);

            return ndx1 === ndx2 && ndy1 === ndy2;
        }

        function clearSelection() {
            document.querySelectorAll('.cell.selected').forEach(cell => {
                if (!cell.classList.contains('found')) {
                    cell.classList.remove('selected');
                }
            });
        }

        function checkSelectedWord() {
            if (selectedCells.length === 0) return;

            const selectedWord = selectedCells.map(cell => grid[cell.y][cell.x]).join('');
            const reversedWord = selectedWord.split('').reverse().join('');

            let matchedWord = null;
            if (WORDS.includes(selectedWord) && !foundWords.has(selectedWord)) {
                matchedWord = selectedWord;
            } else if (WORDS.includes(reversedWord) && !foundWords.has(reversedWord)) {
                matchedWord = reversedWord;
            }

            if (matchedWord) {
                foundWords.add(matchedWord);
                markWordAsFound(matchedWord);
                updateScore();

                // Oznacz komórki jako znalezione
                selectedCells.forEach(cell => {
                    const cellElement = document.querySelector(
                        `.cell[data-x="${cell.x}"][data-y="${cell.y}"]`
                    );
                    cellElement.classList.remove('selected');
                    cellElement.classList.add('found');
                });

                if (foundWords.size === WORDS.length) {
                    document.getElementById('congrats').style.display = 'block';
                }
            } else {
                clearSelection();
            }

            selectedCells = [];
        }

        function markWordAsFound(word) {
            const wordElement = document.getElementById(`word-${word}`);
            if (wordElement) {
                wordElement.classList.add('found');
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = foundWords.size;
        }

        function resetGame() {
            initializeGrid();
            placeWords();
            fillEmptyCells();
            renderGrid();
            renderWordsList();
            updateScore();
            document.getElementById('congrats').style.display = 'none';
        }

        // Inicjalizacja gry
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total').textContent = WORDS.length;
            resetGame();
        });

        // Zapobiegaj zaznaczaniu tekstu podczas przeciągania
        document.addEventListener('selectstart', (e) => {
            if (isSelecting) e.preventDefault();
        });

        // Zapobiegaj domyślnym akcjom touch na całym dokumencie podczas gry
        document.addEventListener('touchmove', (e) => {
            if (isSelecting) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
