<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wykreślanka - Pielęgniarstwo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .words-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .words-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            font-size: 1.2em;
        }

        .words-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .word-item {
            padding: 8px 15px;
            background: white;
            border-radius: 5px;
            border: 2px solid #667eea;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .word-item.found {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
            text-decoration: line-through;
        }

        .grid-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .grid {
            display: inline-grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 2px;
            background: #e0e0e0;
            padding: 2px;
            border-radius: 5px;
        }

        .cell {
            width: 35px;
            height: 35px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            color: #333;
        }

        .cell:hover {
            background: #e3f2fd;
        }

        .cell.selected {
            background: #667eea;
            color: white;
        }

        .cell.found {
            background: #4caf50;
            color: white;
        }

        .score {
            text-align: center;
            font-size: 1.3em;
            margin-top: 20px;
            color: #333;
        }

        .score span {
            color: #667eea;
            font-weight: bold;
        }

        .reset-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .reset-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .congrats {
            text-align: center;
            font-size: 1.5em;
            color: #4caf50;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }

        @media (max-width: 768px) {
            .cell {
                width: 25px;
                height: 25px;
                font-size: 12px;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Wykreślanka</h1>
        <div class="subtitle">Tematyka: Pielęgniarstwo</div>

        <div class="words-section">
            <div class="words-title">Znajdź następujące słowa:</div>
            <div class="words-list" id="wordsList"></div>
        </div>

        <div class="grid-container">
            <div class="grid" id="grid"></div>
        </div>

        <div class="score">
            Znalezione słowa: <span id="score">0</span> / <span id="total">10</span>
        </div>

        <div class="congrats" id="congrats">🎉 Gratulacje! Znalazłeś wszystkie słowa! 🎉</div>

        <button class="reset-btn" onclick="resetGame()">Nowa gra</button>
    </div>

    <script>
        const GRID_SIZE = 15;
        const WORDS = [
            'PIELĘGNIARKA',
            'ZASTRZYK',
            'BANDAŻ',
            'TERMOMETR',
            'LEKARZ',
            'SZPITAL',
            'PACJENT',
            'DIAGNOZA',
            'OPATRUNEK',
            'TERAPIA'
        ];

        let grid = [];
        let wordPositions = {};
        let selectedCells = [];
        let foundWords = new Set();
        let isSelecting = false;

        // Kierunki: prawo, dół, prawo-dół, prawo-góra
        const DIRECTIONS = [
            { dx: 1, dy: 0 },   // poziomo prawo
            { dx: 0, dy: 1 },   // pionowo dół
            { dx: 1, dy: 1 },   // ukośnie prawo-dół
            { dx: 1, dy: -1 }   // ukośnie prawo-góra
        ];

        function initializeGrid() {
            grid = Array(GRID_SIZE).fill(null).map(() =>
                Array(GRID_SIZE).fill('')
            );
            wordPositions = {};
            foundWords = new Set();
        }

        function canPlaceWord(word, x, y, direction) {
            const len = word.length;

            for (let i = 0; i < len; i++) {
                const newX = x + direction.dx * i;
                const newY = y + direction.dy * i;

                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }

                const cell = grid[newY][newX];
                if (cell !== '' && cell !== word[i]) {
                    return false;
                }
            }

            return true;
        }

        function placeWord(word, x, y, direction) {
            const positions = [];

            for (let i = 0; i < word.length; i++) {
                const newX = x + direction.dx * i;
                const newY = y + direction.dy * i;
                grid[newY][newX] = word[i];
                positions.push({ x: newX, y: newY });
            }

            wordPositions[word] = positions;
        }

        function placeWords() {
            const shuffledWords = [...WORDS].sort(() => Math.random() - 0.5);

            for (const word of shuffledWords) {
                let placed = false;
                let attempts = 0;
                const maxAttempts = 100;

                while (!placed && attempts < maxAttempts) {
                    const x = Math.floor(Math.random() * GRID_SIZE);
                    const y = Math.floor(Math.random() * GRID_SIZE);
                    const direction = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];

                    if (canPlaceWord(word, x, y, direction)) {
                        placeWord(word, x, y, direction);
                        placed = true;
                    }

                    attempts++;
                }

                if (!placed) {
                    console.warn(`Nie udało się umieścić słowa: ${word}`);
                }
            }
        }

        function fillEmptyCells() {
            const polishLetters = 'AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSŚTUWYZŹŻ';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x] === '') {
                        grid[y][x] = polishLetters[Math.floor(Math.random() * polishLetters.length)];
                    }
                }
            }
        }

        function renderGrid() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = grid[y][x];
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    cell.addEventListener('mousedown', handleCellMouseDown);
                    cell.addEventListener('mouseenter', handleCellMouseEnter);
                    cell.addEventListener('mouseup', handleCellMouseUp);

                    gridElement.appendChild(cell);
                }
            }
        }

        function renderWordsList() {
            const wordsListElement = document.getElementById('wordsList');
            wordsListElement.innerHTML = '';

            WORDS.forEach(word => {
                const wordItem = document.createElement('div');
                wordItem.className = 'word-item';
                wordItem.textContent = word;
                wordItem.id = `word-${word}`;
                wordsListElement.appendChild(wordItem);
            });
        }

        function handleCellMouseDown(e) {
            isSelecting = true;
            selectedCells = [];
            clearSelection();

            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);
            selectedCells.push({ x, y });
            e.target.classList.add('selected');
        }

        function handleCellMouseEnter(e) {
            if (!isSelecting) return;

            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);

            // Sprawdź czy komórka jest w linii prostej z poprzednimi
            if (selectedCells.length > 0) {
                const lastCell = selectedCells[selectedCells.length - 1];
                const isInLine = checkIfInLine(selectedCells[0], lastCell, { x, y });

                if (isInLine && !selectedCells.some(cell => cell.x === x && cell.y === y)) {
                    selectedCells.push({ x, y });
                    e.target.classList.add('selected');
                }
            }
        }

        function handleCellMouseUp() {
            isSelecting = false;
            checkSelectedWord();
        }

        function checkIfInLine(start, current, next) {
            if (selectedCells.length === 1) return true;

            const dx1 = current.x - start.x;
            const dy1 = current.y - start.y;
            const dx2 = next.x - current.x;
            const dy2 = next.y - current.y;

            // Normalizuj kierunki
            const normalize = (val) => val === 0 ? 0 : val / Math.abs(val);

            const ndx1 = normalize(dx1);
            const ndy1 = normalize(dy1);
            const ndx2 = normalize(dx2);
            const ndy2 = normalize(dy2);

            return ndx1 === ndx2 && ndy1 === ndy2;
        }

        function clearSelection() {
            document.querySelectorAll('.cell.selected').forEach(cell => {
                if (!cell.classList.contains('found')) {
                    cell.classList.remove('selected');
                }
            });
        }

        function checkSelectedWord() {
            if (selectedCells.length === 0) return;

            const selectedWord = selectedCells.map(cell => grid[cell.y][cell.x]).join('');
            const reversedWord = selectedWord.split('').reverse().join('');

            let matchedWord = null;
            if (WORDS.includes(selectedWord) && !foundWords.has(selectedWord)) {
                matchedWord = selectedWord;
            } else if (WORDS.includes(reversedWord) && !foundWords.has(reversedWord)) {
                matchedWord = reversedWord;
            }

            if (matchedWord) {
                foundWords.add(matchedWord);
                markWordAsFound(matchedWord);
                updateScore();

                // Oznacz komórki jako znalezione
                selectedCells.forEach(cell => {
                    const cellElement = document.querySelector(
                        `.cell[data-x="${cell.x}"][data-y="${cell.y}"]`
                    );
                    cellElement.classList.remove('selected');
                    cellElement.classList.add('found');
                });

                if (foundWords.size === WORDS.length) {
                    document.getElementById('congrats').style.display = 'block';
                }
            } else {
                clearSelection();
            }

            selectedCells = [];
        }

        function markWordAsFound(word) {
            const wordElement = document.getElementById(`word-${word}`);
            if (wordElement) {
                wordElement.classList.add('found');
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = foundWords.size;
        }

        function resetGame() {
            initializeGrid();
            placeWords();
            fillEmptyCells();
            renderGrid();
            renderWordsList();
            updateScore();
            document.getElementById('congrats').style.display = 'none';
        }

        // Inicjalizacja gry
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total').textContent = WORDS.length;
            resetGame();
        });

        // Zapobiegaj zaznaczaniu tekstu podczas przeciągania
        document.addEventListener('selectstart', (e) => {
            if (isSelecting) e.preventDefault();
        });
    </script>
</body>
</html>
